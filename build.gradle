// One build for the three jars. The loader plugins are declared here once and applied in each
// project, so ModDevGradle, its legacy Forge variant and Loom share one plugin classpath.
plugins {
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.147' apply false
    id 'fabric-loom' version '1.11.8' apply false
}

subprojects {
    group = mod_group_id

    repositories {
        mavenCentral()
        maven { name = 'Mojang'; url = 'https://libraries.minecraft.net' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
        }
    }
}
