// The Fabric 1.21.1 jar: core + common + the Fabric entry point, platform, mixins and hooks.
plugins {
    id 'fabric-loom'
}

version = "${mod_version}-fabric"

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.srcDirs project(':core').file('src/main/java'), project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

repositories {
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

loom {
    runs {
        // Fabric's in-world tests: `gradle :fabric:runGametest` boots a headless server, runs every
        // @GameTest and exits non-zero if a required one fails.
        gametest {
            server()
            name 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-junit.xml"
            runDir 'build/gametest'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Official Mojang names, the same names common is written against.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // NeoForge's ModConfigSpec on Fabric, so ProficiencyConfig stays exactly as written.
    modImplementation "maven.modrinth:forge-config-api-port:${fcap_version}"

    // Forge Config API Port nests night-config as jar-in-jar, which dev runs do not unpack;
    // ProficiencyConfig's static init needs it. The shipped jar needs neither: in a real instance
    // Fabric Loader loads FCAP's nested copies.
    runtimeOnly 'com.electronwill.night-config:core:3.8.0'
    runtimeOnly 'com.electronwill.night-config:toml:3.8.0'
}

processResources {
    var props = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : project.version,
            mod_description  : mod_description,
            mod_authors      : mod_authors,
            mod_license      : mod_license,
            loader_version   : fabric_loader_version,
            minecraft_version: minecraft_version
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

// The in-world tests are for runGametest, not for anyone's server.
tasks.named('jar') {
    exclude 'dev/amman/proficiency/gametest/**'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
