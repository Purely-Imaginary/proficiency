// The Forge 1.20.1 jar for the Reclamation pack: core + this line's own Minecraft code. It cannot
// share common/ (Minecraft 1.20.1 differs too much), but it compiles core's sources in (and the few
// Hearth classes of common whose source is the same, copySharedHearth below), and it takes the
// shared assets and lang files, with its own additions laid over the lang files.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            // Its own game directory: the run below writes a flat world into its server.properties and
            // deletes its world, which must not touch the dev server's run/ (code review of fs01).
            gameDirectory.set(project.file('run/gametest'))
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    add sourceSets.main, 'proficiency.refmap.json'
    config 'proficiency.mixins.json'
    config 'proficiency.client.mixins.json'
}

sourceSets.main.java.srcDir project(':core').file('src/main/java')

