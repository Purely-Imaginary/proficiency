// The NeoForge 1.21.1 jar: core + common + the NeoForge entry point, platform and event bridge.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.srcDirs project(':core').file('src/main/java'), project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : neo_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// The in-world tests are for runGameTestServer, not for anyone's server.
tasks.named('jar') {
    exclude 'dev/amman/proficiency/gametest/**'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Every GameTest run starts from a fresh world, as on the Forge line.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete file('run/world')
    }
}
