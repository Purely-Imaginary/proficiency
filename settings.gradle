pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'proficiency'

// core: pure Java, compiled into all three jars. common: the Minecraft 1.21.1 code NeoForge and
// Fabric share. Each loader project compiles core (and common) sources itself; see README "Build".
include 'core'
include 'common'
include 'neoforge'
include 'fabric'
include 'forge-1.20.1'
